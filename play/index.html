<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ink Town</title>
<meta name="description" content="Plan it. Plant it. Watch it grow.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ink Town">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,800;1,9..144,900&family=Figtree:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="c" aria-label="Your town"></canvas>

<header id="top" hidden>
  <div class="tl">
    <div class="hn" id="tname">Inkwell</div>
    <div class="sub" id="tsub">Day 1 · Hamlet</div>
  </div>
  <button class="cash" id="cashBtn" type="button" aria-label="Town money">
    <span class="pv" id="money">$20,000</span><span class="sub" id="net">+$0 a day</span>
  </button>
  <div class="row2">
    <button class="chip" id="popChip" type="button" aria-label="Residents">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="6" r="3.4" fill="#fff" stroke="#000" stroke-width="1.8"/><path d="M3.5 18c0-4 2.8-6.5 6.5-6.5s6.5 2.5 6.5 6.5z" fill="#fff" stroke="#000" stroke-width="1.8" stroke-linejoin="round"/></svg><b id="pop">0</b></button>
    <button class="chip" id="hapChip" type="button" aria-label="Happiness">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="#fff" stroke="#000" stroke-width="1.8"/><circle cx="7.2" cy="8" r="1.2"/><circle cx="12.8" cy="8" r="1.2"/><path id="mouth" d="M6.5 12q3.5 3 7 0" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round"/></svg><b id="hap">–</b></button>
    <button class="dem" id="demBtn" type="button" aria-label="What the town wants">
      <span><i id="dH"></i><small>Homes</small></span><span><i id="dS"></i><small>Shops</small></span><span><i id="dW"></i><small>Work</small></span>
    </button>
    <div class="clock" id="dial" role="img" aria-label="Day"><i id="dayArc"></i><svg viewBox="0 0 24 24" id="dialIcon" aria-hidden="true"></svg></div>
  </div>
  <div id="rankbar"><span id="rankL">Hamlet</span><div class="rb"><i id="rankFill"></i></div><span id="rankR">Village at 60</span></div>
</header>
<button id="menuBtn" class="round" type="button" aria-label="Menu" hidden>
  <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 10h16M8 16h16M8 22h16" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
</button>
<div id="side" hidden>
  <button id="speedBtn" class="round" type="button" aria-label="Speed"><svg viewBox="0 0 32 32" aria-hidden="true"><path id="speedIcon" d="" fill="currentColor"/></svg></button>
  <button id="undoBtn" class="round" type="button" aria-label="Undo"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M11 9 5 15l6 6M6 15h12a7 7 0 0 1 0 14h-4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(1 -3)"/></svg></button>
  <button id="homeBtn" class="round" type="button" aria-label="Back to the town hall"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="16" r="3" fill="currentColor"/><path d="M16 3v5M16 24v5M3 16h5M24 16h5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
</div>
<button id="taskPill" type="button" hidden><i>Task</i><span id="taskT"></span></button>

<div id="hint" hidden><span id="hintT"></span></div>
<div id="dock" hidden>
  <div id="tray" hidden>
    <div class="trayhead"><b id="trayT">Homes</b><small id="trayS"></small><button id="trayX" type="button" aria-label="Stop building">Done</button></div>
    <div class="items" id="items"></div>
  </div>
  <nav id="cats" aria-label="Build"></nav>
</div>
<div id="sheet" hidden><div class="sh" id="sheetIn"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="callout"></div>
<div id="card" hidden><div class="panel" id="panel"></div></div>
<script src="js/config.js"></script>
<script src="js/engine.js"></script>
<script src="js/items.js"></script>
<script src="js/town.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/draw.js"></script>
<script src="js/agents.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/screens.js"></script>
<script src="js/input.js"></script>
<script src="js/scene.js"></script>
<script src="js/main.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('/sw.js').catch(()=>{});</script>
</body>
</html>
